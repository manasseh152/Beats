<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beats — Strudel Workstation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Beats</h1>
      <span class="subtitle">strudel workstation</span>
    </div>
    <div id="status" class="status disconnected">
      <span class="status-dot"></span>
      <span class="status-text">Disconnected</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="select-wrap">
      <select id="track-select">
        <option value="">Select a track...</option>
      </select>
    </div>
    <div class="transport">
      <button id="play-btn" class="btn-play" title="Play (Ctrl+Enter)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
      <button id="stop-btn" class="btn-stop" title="Stop (Ctrl+.)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        Stop
      </button>
    </div>
  </div>

  <main>
    <strudel-editor id="repl"><!--
// Pick a track to get started
--></strudel-editor>
  </main>

  <div id="error" class="error" hidden></div>

  <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
  <script src="/app.js"></script>
</body>
</html>
